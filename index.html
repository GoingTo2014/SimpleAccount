<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Simple Account</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#202124}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.shell{width:100%;max-width:430px}
.brand{text-align:center;margin-bottom:18px}
.logo{width:58px;height:58px;margin:0 auto 12px;border:1px solid #d9dce1;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{font-size:26px;margin:0}.tagline{margin:7px 0 0;color:#6b7078;font-size:14px}
.card{background:#fff;border:1px solid #d9dce1;border-radius:12px;padding:24px;box-shadow:0 5px 20px rgba(0,0,0,.06)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#f0f1f3;border-radius:8px;margin-bottom:21px}
.tab{border:0;border-radius:6px;background:transparent;color:#6b7078;padding:10px;font-size:14px;font-weight:600;cursor:pointer}.tab.active{background:#fff;color:#202124;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.heading{margin-bottom:18px}.heading h2{margin:0 0 6px;font-size:20px}.heading p{margin:0;color:#6b7078;font-size:13px;line-height:1.45}
.field{margin-bottom:14px}label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}
input{display:block;width:100%;height:44px;border:1px solid #d9dce1;border-radius:7px;background:#fff;color:#202124;padding:0 12px;font-size:15px;outline:none}
input:focus{border-color:#1a73e8;box-shadow:0 0 0 2px rgba(26,115,232,.12)}
.password{position:relative}.password input{padding-right:68px}.show{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#1a73e8;font-size:12px;font-weight:600;padding:7px;cursor:pointer}
.primary,.outline{width:100%;min-height:44px;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}.primary{border:0;background:#1a73e8;color:#fff;margin-top:4px}.primary:hover{background:#1765cc}.primary:disabled{opacity:.65;cursor:default}
.outline{border:1px solid #d9dce1;background:#fff;color:#202124}
.link{border:0;background:transparent;color:#1a73e8;cursor:pointer;padding:10px 0 0;font-size:13px}
.message{display:none;border-radius:7px;padding:10px 12px;margin-bottom:15px;font-size:13px;line-height:1.4}.message.show{display:block}.error{background:#fdecec;color:#b3261e;border:1px solid #f3c7c7}.success{background:#edf7ef;color:#217346;border:1px solid #c6e5cd}
.hidden{display:none!important}.account{text-align:center}.account-email{margin:8px 0 18px;color:#6b7078;font-size:14px;word-break:break-word}.actions{display:grid;gap:10px}
.footer{text-align:center;color:#8a8f97;font-size:11px;margin-top:16px;line-height:1.5}
@media(max-width:460px){body{padding:15px}.card{padding:20px}}
</style>
</head>
<body>
<main class="shell">
  <div class="brand">
    <div class="logo" aria-hidden="true">S</div>
    <h1>Simple Account</h1>
    <p id="tagline" class="tagline">One account for the Simple ecosystem.</p>
  </div>
  <section class="card">
    <div id="auth">
      <div class="tabs">
        <button id="tabIn" class="tab active" type="button" tabindex="-1">Sign In</button>
        <button id="tabUp" class="tab" type="button" tabindex="-1">Create Account</button>
      </div>
      <div id="signin">
        <div class="heading">
          <h2 id="signinHeading">Welcome back</h2>
          <p id="signinDescription">Sign in to your Simple Account.</p>
        </div>
        <div class="field">
          <label id="inEmailLabel" for="inEmail">Email</label>
          <input id="inEmail" type="email" autocomplete="email" spellcheck="false">
        </div>
        <div class="field">
          <label id="inPassLabel" for="inPass">Password</label>
          <div class="password">
            <input id="inPass" type="password" autocomplete="current-password">
            <button class="show" type="button" data-target="inPass" tabindex="-1">Show</button>
          </div>
        </div>
        <div id="signinMessage" class="message" role="alert"></div>
        <button id="login" class="primary" type="button" tabindex="-1">Sign In</button>
        <button id="forgot" class="link" type="button" tabindex="-1">Forgot password?</button>
      </div>

      <div id="signup" class="hidden">
        <div class="heading">
          <h2 id="signupHeading">Create your Simple Account</h2>
          <p id="signupDescription">Use the same account across Simple apps and services.</p>
        </div>
        <div class="field">
          <label id="upEmailLabel" for="upEmail">Email</label>
          <input id="upEmail" type="email" autocomplete="email" spellcheck="false">
        </div>
        <div class="field">
          <label id="upPassLabel" for="upPass">Password</label>
          <div class="password">
            <input id="upPass" type="password" autocomplete="new-password">
            <button class="show" type="button" data-target="upPass" tabindex="-1">Show</button>
          </div>
        </div>
        <div class="field">
          <label id="upPass2Label" for="upPass2">Confirm password</label>
          <div class="password">
            <input id="upPass2" type="password" autocomplete="new-password">
            <button class="show" type="button" data-target="upPass2" tabindex="-1">Show</button>
          </div>
        </div>
        <div id="signupMessage" class="message" role="alert"></div>
        <button id="signupButton" class="primary" type="button" tabindex="-1">Create Account</button>
      </div>
    </div>

    <div id="account" class="account hidden">
      <div class="heading">
        <h2 id="signedInHeading">You're signed in</h2>
        <p id="signedInDescription">Your Simple Account authentication is complete.</p>
      </div>
      <div id="accountEmail" class="account-email"></div>
      <div id="accountMessage" class="message" role="status"></div>
      <div class="actions">
        <button id="continue" class="primary" type="button" tabindex="-1">Continue</button>
        <button id="logout" class="outline" type="button" tabindex="-1">Sign Out</button>
      </div>
    </div>
  </section>
  <div id="footer" class="footer">Simple Account · Simple ecosystem</div>
</main>

<script>

    en:{tagline:"One account for the Simple ecosystem.",signIn:"Sign In",createAccount:"Create Account",welcome:"Welcome back",signInDescription:"Sign in to your Simple Account.",email:"Email",password:"Password",show:"Show",hide:"Hide",forgot:"Forgot password?",signingIn:"Signing In…",createBusy:"Creating Account…",confirmPassword:"Confirm password",createHeading:"Create your Simple Account",createDescription:"Use the same account across Simple apps and services.",signedIn:"You're signed in",signedInDescription:"Your Simple Account authentication is complete.",continueText:"Continue",signOut:"Sign Out",footer:"Simple Account · Simple ecosystem"},

    hi:{tagline:"पूरे Simple इकोसिस्टम के लिए एक खाता।",signIn:"साइन इन करें",createAccount:"खाता बनाएँ",welcome:"वापसी पर स्वागत है",signInDescription:"अपने Simple Account में साइन इन करें।",email:"ईमेल",password:"पासवर्ड",show:"दिखाएँ",hide:"छिपाएँ",forgot:"पासवर्ड भूल गए?",signingIn:"साइन इन हो रहा है…",createBusy:"खाता बनाया जा रहा है…",confirmPassword:"पासवर्ड की पुष्टि करें",createHeading:"अपना Simple Account बनाएँ",createDescription:"Simple के ऐप्स और सेवाओं में एक ही खाते का उपयोग करें।",signedIn:"आप साइन इन हैं",signedInDescription:"आपके Simple Account का प्रमाणीकरण पूरा हो गया है।",continueText:"जारी रखें",signOut:"साइन आउट करें",footer:"Simple Account · Simple इकोसिस्टम"},
    ru:{tagline:"Один аккаунт для всей экосистемы Simple.",signIn:"Войти",createAccount:"Создать аккаунт",welcome:"С возвращением",signInDescription:"Войдите в свой Simple Account.",email:"Электронная почта",password:"Пароль",show:"Показать",hide:"Скрыть",forgot:"Забыли пароль?",signingIn:"Вход…",createBusy:"Создание аккаунта…",confirmPassword:"Подтвердите пароль",createHeading:"Создайте свой Simple Account",createDescription:"Используйте один аккаунт в приложениях и сервисах Simple.",signedIn:"Вы вошли",signedInDescription:"Аутентификация Simple Account завершена.",continueText:"Продолжить",signOut:"Выйти",footer:"Simple Account · экосистема Simple"},
    de:{tagline:"Ein Konto für das gesamte Simple-Ökosystem.",signIn:"Anmelden",createAccount:"Konto erstellen",welcome:"Willkommen zurück",signInDescription:"Melde dich bei deinem Simple Account an.",email:"E-Mail",password:"Passwort",show:"Anzeigen",hide:"Ausblenden",forgot:"Passwort vergessen?",signingIn:"Anmeldung…",createBusy:"Konto wird erstellt…",confirmPassword:"Passwort bestätigen",createHeading:"Erstelle deinen Simple Account",createDescription:"Verwende dasselbe Konto für Simple-Apps und -Dienste.",signedIn:"Du bist angemeldet",signedInDescription:"Die Authentifizierung deines Simple Accounts ist abgeschlossen.",continueText:"Weiter",signOut:"Abmelden",footer:"Simple Account · Simple-Ökosystem"},
    ar:{tagline:"حساب واحد لمنظومة Simple بالكامل.",signIn:"تسجيل الدخول",createAccount:"إنشاء حساب",welcome:"مرحبًا بعودتك",signInDescription:"سجّل الدخول إلى Simple Account.",email:"البريد الإلكتروني",password:"كلمة المرور",show:"إظهار",hide:"إخفاء",forgot:"هل نسيت كلمة المرور؟",signingIn:"جارٍ تسجيل الدخول…",createBusy:"جارٍ إنشاء الحساب…",confirmPassword:"تأكيد كلمة المرور",createHeading:"أنشئ Simple Account الخاص بك",createDescription:"استخدم الحساب نفسه في تطبيقات وخدمات Simple.",signedIn:"تم تسجيل الدخول",signedInDescription:"اكتملت مصادقة Simple Account.",continueText:"متابعة",signOut:"تسجيل الخروج",footer:"Simple Account · منظومة Simple"}
  };

  function getLanguage(){
    var match=location.search.match(/[?&]lang=([^&]+)/);
    var lang=match?decodeURIComponent(match[1]):"";
    if(!lang && navigator.language){ lang=navigator.language.toLowerCase().split("-")[0]; }
    return translations[lang]?lang:"en";
  }

  var language=getLanguage();
  var text=translations[language];

  function applyTranslations(){
    var map={
      tagline:"tagline",welcome:"signinHeading",signInDescription:"signinDescription",
      email:"inEmailLabel",password:"inPassLabel",confirmPassword:"upPass2Label",
      createHeading:"signupHeading",createDescription:"signupDescription",
      signedIn:"signedInHeading",signedInDescription:"signedInDescription",
      continueText:"continue",signOut:"logout",footer:"footer"
    };
    Object.keys(map).forEach(function(key){
      var el=$(map[key]);
      if(el){el.textContent=text[key];}
    });
    $("tabIn").textContent=text.signIn;
    $("tabUp").textContent=text.createAccount;
    $("login").textContent=text.signIn;
    $("forgot").textContent=text.forgot;
    $("signupButton").textContent=text.createAccount;
    var upEmailLabel=$("upEmailLabel");
    var upPassLabel=$("upPassLabel");
    if(upEmailLabel){upEmailLabel.textContent=text.email;}
    if(upPassLabel){upPassLabel.textContent=text.password;}
    for(var i=0;i<showButtons.length;i++){ showButtons[i].textContent=text.show; }
    document.documentElement.lang=language;
    if(language==="ar"){ document.documentElement.dir="rtl"; }
  }

  function $(id){ return document.getElementById(id); }

  function showMessage(messageText,type){
    var el;
    var signinVisible=$("signin").className.indexOf("hidden")===-1;

    if(signinVisible){
      el=$("signinMessage");
    }else{
      el=$("signupMessage");
    }

    if(!el){ return; }

    el.textContent=messageText||"";
    el.className="message show "+(type||"error");
  }

  function clearMessage(){
    var signinMessage=$("signinMessage");
    var signupMessage=$("signupMessage");

    if(signinMessage){
      signinMessage.className="message";
      signinMessage.textContent="";
    }

    if(signupMessage){
      signupMessage.className="message";
      signupMessage.textContent="";
    }
  }

  function showAccountMessage(text,type){
    var el=$("accountMessage");
    el.textContent=text||"";
    el.className="message show "+(type||"success");
  }

  function firebaseMessage(data){
    var code="";
    if(data && data.error && data.error.message){ code=data.error.message; }
    var map={
      EMAIL_EXISTS:"That email is already associated with a Simple Account.",
      EMAIL_NOT_FOUND:"No Simple Account was found with that email.",
      INVALID_PASSWORD:"The password is incorrect.",
      INVALID_LOGIN_CREDENTIALS:"The email or password is incorrect.",
      INVALID_EMAIL:"Please enter a valid email address.",
      USER_DISABLED:"This Simple Account has been disabled.",
      TOO_MANY_ATTEMPTS_TRY_LATER:"Too many attempts. Please try again later.",
      OPERATION_NOT_ALLOWED:"Email and password sign-in is not enabled.",
      WEAK_PASSWORD:"The password is too weak. Use at least 6 characters.",
      PASSWORD_DOES_NOT_MEET_REQUIREMENTS:"The password does not meet the account password requirements."
    };
    return map[code] || "Simple Account could not complete that request.";
  }

  function authRequest(endpoint,body,done){
    var xhr=new XMLHttpRequest();
    xhr.open("POST",AUTH_BASE+endpoint+API_KEY,true);
    xhr.setRequestHeader("Content-Type","application/json");
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4){ return; }

      var data={};
      try{ data=JSON.parse(xhr.responseText||"{}"); }catch(e){}

      if(xhr.status>=200 && xhr.status<300){
        done(null,data);
      }else{
        done(new Error(firebaseMessage(data)),null);
      }
    };
    xhr.onerror=function(){
      done(new Error("Unable to connect to Simple Account. Check your internet connection."),null);
    };
    try{
      xhr.send(JSON.stringify(body));
    }catch(e){
      done(new Error("Unable to connect to Simple Account. Check your internet connection."),null);
    }
  }

  function setBusy(button,busy,busyText,normalText){
    button.disabled=busy;
    button.textContent=busy ? busyText : normalText;
  }

  function switchMode(signIn){
    clearMessage();
    $("tabIn").className="tab"+(signIn?" active":"");
    $("tabUp").className="tab"+(signIn?"":" active");
    $("signin").className=signIn?"":"hidden";
    $("signup").className=signIn?"hidden":"";
  }

  function notifyAndroidAuthenticated(){
    if(window.Android && typeof window.Android.onSimpleAccountAuthenticated==="function"){
      try{
        window.Android.onSimpleAccountAuthenticated(
          state.idToken||"",
          state.refreshToken||"",
          state.localId||"",
          state.email||""
        );
      }catch(e){}
    }
  }

  function notifyAndroidCancelled(){
    if(window.Android && typeof window.Android.onSimpleAccountCancelled==="function"){
      try{ window.Android.onSimpleAccountCancelled(); }catch(e){}
    }
  }

  function signedIn(data){
    state.idToken=data.idToken||null;
    state.refreshToken=data.refreshToken||null;
    state.localId=data.localId||null;
    state.email=data.email||null;

    $("auth").className="hidden";
    $("account").className="account";
    $("accountEmail").textContent=state.email||"Simple Account";
  }

  function login(){
    clearMessage();
    var email=$("inEmail").value.replace(/^\s+|\s+$/g,"");
    var password=$("inPass").value;
    var button=$("login");

    if(!email){ showMessage("Enter your email address."); return; }
    if(!password){ showMessage("Enter your password."); return; }

    setBusy(button,true,text.signingIn,text.signIn);
    authRequest("signInWithPassword",{
      email:email,
      password:password,
      returnSecureToken:true
    },function(error,data){
      setBusy(button,false,text.signingIn,text.signIn);
      if(error){ showMessage(error.message); return; }
      signedIn(data);
    });
  }

  function signup(){
    clearMessage();
    var email=$("upEmail").value.replace(/^\s+|\s+$/g,"");
    var password=$("upPass").value;
    var password2=$("upPass2").value;
    var button=$("signupButton");

    if(!email){ showMessage("Enter your email address."); return; }
    if(password.length<6){ showMessage("Your password must be at least 6 characters."); return; }
    if(password!==password2){ showMessage("The passwords do not match."); return; }

    setBusy(button,true,text.createBusy,text.createAccount);
    authRequest("signUp",{
      email:email,
      password:password,
      returnSecureToken:true
    },function(error,data){
      setBusy(button,false,text.createBusy,text.createAccount);
      if(error){ showMessage(error.message); return; }
      signedIn(data);
    });
  }

  function forgot(){
    clearMessage();
    var email=$("inEmail").value.replace(/^\s+|\s+$/g,"");
    var button=$("forgot");

    if(!email){ showMessage("Enter your email first."); return; }

    setBusy(button,true,"Sending…","Forgot password?");
    authRequest("sendOobCode",{
      requestType:"PASSWORD_RESET",
      email:email
    },function(error){
      setBusy(button,false,"Sending…","Forgot password?");
      if(error){ showMessage(error.message); return; }
      showMessage("A password reset email has been sent to "+email+".","success");
    });
  }

  function logout(){
    state={idToken:null,refreshToken:null,localId:null,email:null};
    $("account").className="account hidden";
    $("auth").className="";
    $("inPass").value="";
    switchMode(true);
    notifyAndroidCancelled();
  }

  function togglePassword(id,button){
    var input=$(id);
    if(!input){ return; }
    if(input.type==="password"){
      input.type="text";
      button.textContent=text.hide;
    }else{
      input.type="password";
      button.textContent=text.show;
    }
  }

  document.addEventListener("focusin",function(e){
    var target=e.target;
    if(!target || target.tagName!=="BUTTON"){ return; }

    /*
     * KitKat WebView may place focus on the first button when the WebView
     * receives native focus. Do not allow that to steal the HTML editor.
     * The button's click handler still runs normally after focus is moved.
     */
    setTimeout(function(){
      var signin=document.getElementById("signin");
      var active=document.activeElement;
      if(!signin || signin.className.indexOf("hidden")!==-1){ return; }
      if(active===target || (active && active.tagName==="BUTTON")){
        var email=document.getElementById("inEmail");
        var password=document.getElementById("inPass");
        if(password && document.activeElement===target){
          password.focus();
        }else if(email){
          email.focus();
        }
      }
    },0);
  });

  $("tabIn").onclick=function(){ switchMode(true); };
  $("tabUp").onclick=function(){ switchMode(false); };
  $("login").onclick=login;
  $("signupButton").onclick=signup;
  $("forgot").onclick=forgot;
  $("logout").onclick=logout;

  $("continue").onclick=function(){
    notifyAndroidAuthenticated();
  };

  var showButtons=document.getElementsByClassName("show");
  applyTranslations();
  for(var si=0;si<showButtons.length;si++){
    showButtons[si].onclick=function(){
      togglePassword(this.getAttribute("data-target"),this);
    };
  }

  $("inEmail").onkeydown=function(e){ if(e.keyCode===13){ login(); } };
  $("inPass").onkeydown=function(e){ if(e.keyCode===13){ login(); } };
  $("upEmail").onkeydown=function(e){ if(e.keyCode===13){ signup(); } };
  $("upPass").onkeydown=function(e){ if(e.keyCode===13){ signup(); } };

    getCurrentUser:function(){

    getAuthTokensForAndroid:function(){
      if(!state.idToken){ return null; }
